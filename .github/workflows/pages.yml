name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deployment already under way is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

# The card of every deck is committed, so no deployment launches a browser.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A user site and a project site differ in base path and origin, and
      # neither can be worked out from the repository name alone.
      - id: pages
        uses: actions/configure-pages@v5

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A user site reports an empty base path, which unquoted would eat the next flag.
      - run: >
          node site/build.mjs
          --base "${{ steps.pages.outputs.base_path }}"
          --origin "${{ steps.pages.outputs.origin }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
