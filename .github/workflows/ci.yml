name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only pnpm fit launches a browser, and that is run by hand.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint

      # The same build the deployment runs, so a pull request covers that path.
      # A push to main skips it, because the pages run builds the same decks.
      - if: github.event_name != 'push'
        run: node site/build.mjs
