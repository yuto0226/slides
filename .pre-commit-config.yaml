default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # rumdl reflows prose sentence-per-line and rejects repeated top-level
  # headings; both corrupt a deck, so it sees the repository's own prose only.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      - id: rumdl-fmt
        files: ^(README|AGENTS)\.md$
      - id: rumdl-check
        files: ^(README|AGENTS)\.md$

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types_or: [vue, ts, javascript, json, yaml, css]

      - id: prettier-slides
        name: prettier (slidev)
        entry: pnpm exec prettier --write
        language: system
        files: ^decks/[^/]+/slides\.md$

      # zhtw-mcp is installed outside this repository and must be on PATH.
      # A deck's frontmatter is YAML, which the linter reads as prose, so this
      # feeds it the slide bodies alone.
      - id: zhtw-deck
        name: zhtw-mcp (zh-TW prose, deck)
        entry: node scripts/zhtw.mjs
        language: system
        files: ^decks/[^/]+/slides\.md$

      - id: check-commit-msg
        name: check commit message
        entry: uv run scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
